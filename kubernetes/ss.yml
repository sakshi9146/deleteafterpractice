apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dbapp
  labels:
    app: dbapp
spec:
      replicas: 2
      selector:
        matchLabels:
          app: dbapp
      template:
        metadata:
          labels:
            app: dbapp
        spec:
          containers:
          - name : dbapp
            image: mysql:latest
            ports:
             - containerPort: 3306
            env:
            - name: MYSQL_ROOT_PASSWORD
              value: "1234" 


