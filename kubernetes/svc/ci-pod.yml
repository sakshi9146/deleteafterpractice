apiVersion: v1
kind: Pod
metadata: 
  name: cipod
  labels:
      app: ciapp

spec:
  containers:
    - name: cipod
      image : nginx:latest
      ports:
      - containerPort: 80

---
apiVersion: v1
kind: Service
metadata: 
  name: cipod
  labels:
    app: ciapp
spec:
  type: ClusterIP
  selector: 
    app: ciapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80  

