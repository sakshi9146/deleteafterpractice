apiVersion: v1

kind: Pod
metadata:
  name: nppod
  labels:
    app: npapp
spec:
  name: nppod
  image: nginx
  ports:
  - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: npservice
  labels: 
    app: npapp
spec:
  type: NodePort
  selector:
   app: npapp
  ports: 
    - protocol: TCP
      port: 80
      targetPort: 80
